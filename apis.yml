aid: finary
name: Finary
description: >-
  Finary is a French fintech platform for personal wealth tracking and
  management that aggregates a user's entire net worth — stocks, funds, ETFs,
  cryptocurrency, real estate, savings, life insurance, startups and other
  alternative assets — into a single dashboard by connecting to 20,000+ banks
  and brokers worldwide. Beyond tracking, Finary offers fee detection,
  diversification and sector/geo allocation analysis, dividend monitoring,
  budgeting, in-app crypto buying/selling and staking, and life-insurance
  products. The company reports more than one million users and is regulated in
  France by the AMF and ACPR. Finary does not publish an official public REST
  API or SDKs; the app frontends talk to a private API that the developer
  community has reverse-engineered into an unofficial OpenAPI spec and language
  wrappers.
